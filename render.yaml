# Render Blueprint: New > Blueprint, pick this repo. Secrets (sync: false) are asked for on first deploy.
services:
  - type: web
    name: lany-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_APPLICATION_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      # Comma-separated origins allowed by CORS, e.g. https://lany.vercel.app
      - key: FRONTEND_URL
        sync: false
